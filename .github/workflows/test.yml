name: Test & Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r documents/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        env:
          DASHSCOPE_API_KEY: test-key-for-ci
        run: |
          pytest test/test_text_splitter.py test/test_hybrid_retriever.py test/test_reranker.py test/test_rag_chain.py -v --tb=short --cov=app/core --cov-report=term-missing

      - name: Run system import test
        env:
          DASHSCOPE_API_KEY: test-key-for-ci
        run: |
          python -c "
          from app.core.data_loader import DataLoader
          from app.core.text_splitter import TextSplitter
          from app.core.embedding import EmbeddingModel
          from app.core.hybrid_retriever import HybridRetriever
          from app.core.reranker import RerankerFactory
          from app.core.vector_db import VectorDatabase
          from app.evaluation.dataset_manager import TestDatasetManager
          from app.evaluation.retrieval_evaluator import RetrievalEvaluator
          from app.evaluation.experiment_tracker import ExperimentTracker
          print('All imports successful')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jie-rag:latest .

      - name: Verify image
        run: docker images jie-rag:latest
